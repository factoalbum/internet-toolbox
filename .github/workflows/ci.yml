name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: QA
        run: npm run qa

      - name: India metal rate parser tests
        run: node --experimental-strip-types --test scripts/test-india-metal-rates.mjs

      - name: Site audit
        run: npm run site-audit

      - name: Build
        run: npm run build
